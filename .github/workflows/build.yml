name: Build Releases

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: ADHI-HUB.exe
            args: --onefile --name ADHI-HUB downloader.py
          - os: ubuntu-latest
            name: ADHI-HUB-linux
            args: --onefile --name ADHI-HUB-linux downloader.py
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller yt-dlp rich

      - name: Build binary
        run: pyinstaller ${{ matrix.args }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.name }}
          tag_name: ${{ github.ref_name }}